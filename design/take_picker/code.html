<style>
        /* Custom animations for technical feel */
        @keyframes pulse-glow {

        }
        .animate-pulse-glow {
            animation: pulse-glow 2s infinite;
        }
        
        .waveform-bar {
            width: 3px;
            border-radius: 1px;
            background-color: theme('colors.surface-variant');
            transition: height 0.2s ease, background-color 0.2s ease;
        }
        .waveform-bar.active {
            background: linear-gradient(to top, theme('colors.primary-fixed'), theme('colors.secondary-container'));
